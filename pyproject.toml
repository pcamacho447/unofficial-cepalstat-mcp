[project]
name = "unofficial-cepalstat-mcp"
version = "0.1.0"
description = "Unofficial Python client, semantic resolution engine, and MCP server for UN CEPALSTAT Open Data API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Patricio Camacho" }
]
keywords = [
    "cepal",
    "cepalstat",
    "eclac",
    "mcp",
    "model-context-protocol",
    "latin-america",
    "economics",
    "statistics",
    "semantic-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
    "plotly>=5.20.0",
    "platformdirs>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/pcamacho447/unofficial-cepalstat-mcp"
Repository = "https://github.com/pcamacho447/unofficial-cepalstat-mcp"
Issues = "https://github.com/pcamacho447/unofficial-cepalstat-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "jupyterlab>=4.0.0",
]

[project.scripts]
unofficial-cepalstat-mcp = "unofficial_cepalstat_mcp.cli:main"
cepalstat-mcp = "unofficial_cepalstat_mcp.cli:main"
statscepal = "unofficial_cepalstat_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unofficial_cepalstat_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: live API integration tests",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

